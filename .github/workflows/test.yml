name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: shellcheck scripts/build-calendar.sh tests/run.sh tests/regen-golden.sh
      - name: Test
        run: tests/run.sh
